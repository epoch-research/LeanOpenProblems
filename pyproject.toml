[project]
name = "apn"
version = "0.1.4rc7"
description = "An Inspect implementation of the AlphaProof Nexus formal proof-search framework"
requires-python = ">=3.13,<3.14"
dependencies = [
    "inspect-ai>=0.3.229",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apn"]
artifacts = [
    "apn/data/oeis/**/*",
]

[project.entry-points.inspect_ai]
apn = "apn._registry"

[dependency-groups]
dev = [
    "anthropic>=0.105.2",
    "hawk[cli]",
    "mypy>=2.1.0",
    "openai>=2.38.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "types-PyYAML>=6.0",
]

[tool.uv]
# Force inspect-ai to come from PyPI rather than hawk's [tool.uv.sources].
override-dependencies = ["inspect-ai"]

[tool.uv.sources]
hawk = { git = "https://github.com/METR/hawk", subdirectory = "hawk", tag = "v2026.06.01" }

[tool.mypy]
python_version = "3.13"
files = ["apn", "tests"]
# Vendored third-party docs/examples, not our code.
exclude = 'pypantograph-docs'
strict = true
# Inspect ships py.typed; lean on its annotations.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
