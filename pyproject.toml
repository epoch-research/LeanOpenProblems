[project]
name = "tsoukalas-lean"
version = "0.1.0"
description = "An Inspect implementation of the AlphaProof Nexus formal proof-search framework"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.229",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apn"]

[dependency-groups]
dev = [
    "anthropic>=0.105.2",
    "mypy>=2.1.0",
    "openai>=2.38.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "types-PyYAML>=6.0",
]

[tool.mypy]
python_version = "3.11"
files = ["apn", "tests"]
strict = true
# Inspect ships py.typed; lean on its annotations.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# PyPantograph is only installed inside the Lean sandbox image, not on the host
# where mypy runs. apn/lean/apn_lean.py imports it lazily.
module = "pantograph.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
