[project]
name = "apn"
version = "0.1.11rc9"
description = "An Inspect implementation of the AlphaProof Nexus formal proof-search framework"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "inspect-boltons @ git+https://github.com/tadamcz/inspect_boltons@35b794e845f1748947a4f18efdfcb31dd0cf746a",
    "tenacity>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["apn"]
artifacts = [
    "apn/data/oeis/**/*",
    "apn/data/fc100open/**/*",
    "apn/data/erdos/**/*",
]

[project.entry-points.inspect_ai]
apn = "apn._registry"

[dependency-groups]
dev = [
    "anthropic>=0.105.2",
    "hawk[cli]",
    "inspect-ai>=0.3.263",
    "inspect-k8s-sandbox",
    "mypy>=2.1.0",
    "openai>=2.38.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "types-PyYAML>=6.0",
    "environs",
]

[tool.uv]
# Force inspect-ai to come from PyPI rather than hawk's [tool.uv.sources].
override-dependencies = ["inspect-ai"]

[tool.uv.sources]
hawk = { git = "https://github.com/METR/hawk", subdirectory = "hawk", tag = "v3.3.1" }
# apn/sandbox.py drives K8sSandboxEnvironment.sample_init/sample_cleanup
# directly, so tests and type checks only mean anything against the exact
# code hawk runs. Keep this rev in sync with hawk's own pin when bumping
# the hawk tag above; uv does not inherit a dependency's [tool.uv.sources].
inspect-k8s-sandbox = { git = "https://github.com/METR/inspect_k8s_sandbox.git", rev = "ff1ef4a6d845ed0abce87408e2ab2275d31c3687" }

[tool.mypy]
python_version = "3.13"
files = ["apn", "tests"]
# tests/ is a namespace package (no __init__.py); tests import shared plumbing
# as `tests.lean_sandbox`, so pin the repo root as the package base.
explicit_package_bases = true
strict = true
# Inspect ships py.typed; lean on its annotations.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
