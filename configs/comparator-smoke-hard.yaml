# Schema reference for eval-set config:
# https://github.com/METR/hawk/blob/main/hawk/api/EvalSetConfig.schema.json
#
# SMOKE eval for the SafeVerify->Comparator migration (comparator-migration-plan.md),
# REJECT path: 5 conjectures no model ever settled, at a low $50/sample budget,
# so the agent's attempts are rejected by Comparator -- exercising the reject path.
# Validates the full pipeline end to end on Hawk/k8s: the agent image, the new
# `comparator` verifier image (Comparator + lean4export + landrun, read-only
# rootfs + tmpfs), the k8s sandbox_backend (chart-native values.yaml), the
# claim-declaring submit tool, and -- on a solve -- the Comparator ACCEPT path.
#
# Preconditions:
#   1. The `comparator` branch's images are pushed to ECR (run the
#      build-docker-images workflow on the comparator ref first; it builds the
#      `comparator` target, which does not exist on main).
#   2. The apn package below is pinned to @comparator, NOT the default branch
#      (main still ships the old SafeVerify apn).
retry_attempts: 1  # smoke: surface real errors rather than masking them with retries

tasks:
  - package: git+ssh://git@github.com/epoch-research/LeanOpenProblems.git@comparator
    name: apn
    items:
      - name: apn_oeis
        args:
          # 5 OEIS conjectures no model ever settled (attempted + INCORRECT
          # in all 15 historical runs) -- extremely hard/open.
          subset: comparator_smoke_hard
          # Hawk runs on k8s: emit the chart-native values.yaml, not the
          # docker compose (whose read_only/tmpfs keys Hawk's converter rejects).
          sandbox_backend: k8s
name: comparator-smoke-hard
epochs: 1
models:
  # Epoch model wrappers (bypass middleman): API keys come straight from the
  # secrets below; max_tokens/context window come from the package's models.yaml.
  - package: git+https://github.com/epoch-research/benchmarks@giles-hawkbench-newstuff
    name: epoch
    items:
      - name: claude-fable-5
        args:
          config:
            reasoning_effort: "high"
            max_retries: 7
            # max_sandboxes isn't user-settable; Hawk sizes it as
            # 2 x sum(max_connections) across providers
            max_connections: 40

# Low per-sample cap: these are unsolvable in practice, so the agent burns the
# $50 on rejected attempts (5 samples x $50 = $250 hard ceiling), which is the
# point -- we want Comparator to reject real attempts.
cost_limit: 50.0
working_limit: 86_400  # 24h per sample

# Prices in dollars per 1M tokens (from scripts/data/model_prices_and_context_window.json).
# Keys must match Inspect's resolved <provider>/<model> names.
model_cost_config:
  epoch/claude-fable-5:
    input: 10.0
    output: 50.0
    input_cache_read: 1.0
    input_cache_write: 12.5

secrets:
  - name: ANTHROPIC_API_KEY
  - name: OPENAI_API_KEY
  - name: GOOGLE_API_KEY
  - name: LEAN_OPEN_PROBLEMS_IMAGE_NAME
    description: "The ECR repo containing the LeanOpenProblems sandbox images"

runner:
  memory: 200Gi
  environment:
    # TODO: Remove once default in Hawk
    INSPECT_LOG_CONDENSE: "true"
    ANTHROPIC_BASE_URL: https://api.anthropic.com
    OPENAI_BASE_URL: https://api.openai.com/v1
    GOOGLE_BASE_URL: https://generativelanguage.googleapis.com
    HAWK_RUNNER_REFRESH_CLIENT_ID: ""
    HAWK_RUNNER_REFRESH_TOKEN: ''

packages:
  - inspect-ai==0.3.245
