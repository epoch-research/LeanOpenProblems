# Schema reference for eval-set config:
# https://github.com/METR/hawk/blob/main/hawk/api/EvalSetConfig.schema.json
retry_attempts: 0  # Disable retries while we're still working out the kinks
tasks:
  - package: git+ssh://git@github.com/epoch-research/LeanOpenProblems.git
    name: apn
    items:
      # Two named subsets (apn/data/oeis/subsets/*.txt), passed as task args so
      # each apn_oeis item has a distinct Inspect task identifier. Drop the
      # `subset` arg to run the full 492-conjecture OEIS benchmark.
      - name: apn_oeis
        args:
          gated: true
          literature: true
          # 38 OEIS conjectures with published APN proof outputs.
          subset: proved38
      - name: apn_oeis
        args:
          gated: true
          literature: true
          # 40 random OEIS conjectures not in the published APN proof-output set.
          subset: unproved40
epochs: 1
models:
  - package: openai
    name: openai
    items:
      - name: gpt-5.5
        args:
          config:
            # Defaults to 'none' in GPT 5.4
            reasoning_effort: "medium"
token_limit: 1_000_000_000
working_limit: 129_600  # 36 * 60 * 60

secrets:
  - name: ANTHROPIC_API_KEY
  - name: OPENAI_API_KEY
  - name: GOOGLE_API_KEY
  - name: LEAN_OPEN_PROBLEMS_IMAGE_NAME
    description: "The ECR repo containing the LeanOpenProblems sandbox images"

runner:
  memory: 200Gi
  environment:
    # TODO: Remove once default in Hawk
    INSPECT_LOG_CONDENSE: "true"
    ANTHROPIC_BASE_URL: https://api.anthropic.com
    OPENAI_BASE_URL: https://api.openai.com/v1
    GOOGLE_BASE_URL: https://generativelanguage.googleapis.com
    HAWK_RUNNER_REFRESH_CLIENT_ID: ""
