# Schema: https://github.com/METR/hawk/blob/main/hawk/api/EvalSetConfig.schema.json
#
# jacobian: the Jacobian conjecture over ℂ with the problem-specific prompt,
# both goals (resolve either way; counterexample only), deep agent, no
# literature corpus.
name: jacobian
tasks:
  - package: git+ssh://git@github.com/epoch-research/LeanOpenProblems.git@jacobian-conjecture
    name: apn
    items:
      - name: apn_jacobian
        args:
          goal: resolve
          agent_type: deep
          literature: false
      - name: apn_jacobian
        args:
          goal: counterexample
          agent_type: deep
          literature: false
models:
  - package: git+https://github.com/epoch-research/benchmarks@48493325ca9c99d21e7c53062ed68e2849f3dffa
    name: epoch
    items:
      - name: claude-fable-5
        args:
          config:
            # Policy: use the highest reasoning effort the model supports.
            reasoning_effort: "max"
            max_retries: 485
            max_connections: 40
      - name: gpt-6-astra
        args:
          config:
            # Policy: use the highest reasoning effort the model supports.
            reasoning_effort: "max"
            max_retries: 485
            max_connections: 40

# 2 models x 2 samples x $3,000/sample cap = $12,000 max; gated runs sit near max.
cost_limit: 3000.0
working_limit: 864_000  # 10 * 24 * 60 * 60

# $ per 1M tokens; keys must match Inspect's resolved <provider>/<model> names.
model_cost_config:
  epoch/claude-fable-5:
    input: 10.0
    output: 50.0
    input_cache_read: 1.0
    input_cache_write: 12.5
  epoch/gpt-6-astra:
    input: 10.0
    output: 50.0
    input_cache_read: 1.0
    input_cache_write: 12.5

secrets:
  - name: ANTHROPIC_API_KEY
  - name: OPENAI_API_KEY
  - name: GOOGLE_API_KEY
  - name: LEAN_OPEN_PROBLEMS_IMAGE_NAME
    description: "The ECR repo containing the LeanOpenProblems sandbox images"

runner:
  memory: 200Gi
  storage_request: 410Gi
  storage_limit: 410Gi
  environment:
    # TODO: Remove once default in Hawk
    INSPECT_LOG_CONDENSE: "true"
    ANTHROPIC_BASE_URL: https://api.anthropic.com
    OPENAI_BASE_URL: https://api.openai.com/v1
    GOOGLE_BASE_URL: https://generativelanguage.googleapis.com
    HAWK_RUNNER_REFRESH_CLIENT_ID: ""
    HAWK_RUNNER_REFRESH_TOKEN: ''

packages:
  # Right now needs to be kept in sync with the pinned epoch-research/benchmarks commit.
  # TODO Remove once this wart is no longer necessary.
  - inspect-ai==0.3.273

checkpoint:
  enabled: true
  trigger:
    type: time
    every: 43200
