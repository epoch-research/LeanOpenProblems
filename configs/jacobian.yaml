# Schema: https://github.com/METR/hawk/blob/main/hawk/api/EvalSetConfig.schema.json
#
# jacobian: the Jacobian conjecture over ℂ with the problem-specific prompt,
# both goals (resolve either way; counterexample only), deep agent, no
# literature corpus.
name: jacobian
tasks:
  - package: git+ssh://git@github.com/epoch-research/LeanOpenProblems.git@576c04780c7890e4f9ef106fd4772ebea535bcd3
    name: apn
    items:
      - name: apn_jacobian
        args:
          goal: resolve
          agent_type: deep
          literature: false
      - name: apn_jacobian
        args:
          goal: counterexample
          agent_type: deep
          literature: false
models:
  - package: git+https://github.com/epoch-research/benchmarks
    name: epoch
    items:
      - name: claude-fable-5
        args:
          config:
            # Policy: use the highest reasoning effort the model supports.
            reasoning_effort: "max"
            max_retries: 7
            max_connections: 40
      - name: gpt-5.6-sol
        args:
          config:
            # Policy: use the highest reasoning effort the model supports.
            reasoning_effort: "max"
            max_retries: 7
            max_connections: 40

# 2 models x 2 samples x $300/sample cap = $1,200 max; gated runs sit near max.
cost_limit: 300.0
working_limit: 259_200  # 72 * 60 * 60

# $ per 1M tokens; keys must match Inspect's resolved <provider>/<model> names.
model_cost_config:
  epoch/claude-fable-5:
    input: 10.0
    output: 50.0
    input_cache_read: 1.0
    input_cache_write: 12.5
  epoch/gpt-5.6-sol:
    input: 5.0
    output: 30.0
    input_cache_read: 0.5
    input_cache_write: 6.25

secrets:
  - name: ANTHROPIC_API_KEY
  - name: OPENAI_API_KEY
  - name: GOOGLE_API_KEY
  - name: LEAN_OPEN_PROBLEMS_IMAGE_NAME
    description: "The ECR repo containing the LeanOpenProblems sandbox images"

runner:
  memory: 200Gi
  environment:
    # TODO: Remove once default in Hawk
    INSPECT_LOG_CONDENSE: "true"
    ANTHROPIC_BASE_URL: https://api.anthropic.com
    OPENAI_BASE_URL: https://api.openai.com/v1
    GOOGLE_BASE_URL: https://generativelanguage.googleapis.com
    HAWK_RUNNER_REFRESH_CLIENT_ID: ""
    HAWK_RUNNER_REFRESH_TOKEN: ''

packages:
  # Right now needs to be kept in sync with epoch-research/benchmarks@main.
  # TODO Remove once this wart is no longer necessary.
  - inspect-ai==0.3.259

retry_on_error: 16  # https://github.com/epoch-research/epoch-hawk/pull/13
