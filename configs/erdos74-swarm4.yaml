# Schema: https://github.com/METR/hawk/blob/main/hawk/api/EvalSetConfig.schema.json
name: erdos74-swarm4

tasks:
  - package: git+ssh://git@github.com/epoch-research/LeanOpenProblems.git@swarm
    name: apn
    items:
      - name: apn_erdos
        args:
          subset: bloom_selection
          agent_type: react
          swarm_size: 4
          literature: true
        sample_ids:
          - Erdos74.erdos_74
models:
  - package: openai
    name: openai
    items:
      - name: gpt-6-astra
        args:
          config:
            reasoning_effort: "max"
            max_retries: 7
            max_connections: 10

cost_limit: 400.0
working_limit: 432_000  # 5 * 24 * 60 * 60

# $ per 1M tokens; keys must match Inspect's resolved <provider>/<model> names.
model_cost_config:
  openai/gpt-6-astra:
    input: 10.0
    output: 50.0
    input_cache_read: 1.0
    input_cache_write: 12.5

secrets:
  - name: LEAN_OPEN_PROBLEMS_IMAGE_NAME
    description: "The ECR repo containing the LeanOpenProblems sandbox images"

runner:
  memory: 200Gi
  environment:
    INSPECT_LOG_CONDENSE: "true"
    UV_EXCLUDE_NEWER: "2026-10-24T00:00:00Z"

packages:
  - inspect-ai==0.3.283
  - semver>=3.0.0,<3.1.0
