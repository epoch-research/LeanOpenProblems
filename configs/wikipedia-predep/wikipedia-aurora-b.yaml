models:
  # giles-aurora2: the first epoch-research/benchmarks commit with Aurora in models.yaml.
  - package: git+https://github.com/epoch-research/benchmarks@e60b6bb0c7306ac66d8b6e0873d96300d4eb9572
    name: epoch
    items:
      - name: aurora-alpha-bio-cyber-capabilities
        args:
          config:
            # Policy: use the highest reasoning effort the model supports.
            reasoning_effort: "max"
            max_retries: 485
            # Hawk sizes the sandbox pool at 2 x max_connections (2 sandboxes per
            # sample), so this lets every sample in this half run at once.
            max_connections: 140

# Half b of the 273-sample dataset (split in manifest order so every
# sample runs at once): 136 samples x $1,000/sample cap = $136,000 max.
cost_limit: 1000.0
working_limit: 345_600  # 4 * 24 * 60 * 60

# $ per 1M tokens; keys must match Inspect's resolved <provider>/<model> names.
# Aurora's prices are not published; GPT-6 Astra's are assumed.
model_cost_config:
  epoch/aurora-alpha-bio-cyber-capabilities:
    input: 10.0
    output: 50.0
    input_cache_read: 1.0
    input_cache_write: 12.5

secrets:
  - name: ANTHROPIC_API_KEY
  - name: OPENAI_API_KEY
  - name: GOOGLE_API_KEY
  - name: LEAN_OPEN_PROBLEMS_IMAGE_NAME
    description: "The ECR repo containing the LeanOpenProblems sandbox images"

runner:
  memory: 200Gi
  environment:
    # TODO: Remove once default in Hawk
    INSPECT_LOG_CONDENSE: "true"
    ANTHROPIC_BASE_URL: https://api.anthropic.com
    OPENAI_BASE_URL: https://api.openai.com/v1
    GOOGLE_BASE_URL: https://generativelanguage.googleapis.com
    HAWK_RUNNER_REFRESH_CLIENT_ID: ""
    HAWK_RUNNER_REFRESH_TOKEN: ''

packages:
  # Right now needs to be kept in sync with the pinned epoch-research/benchmarks commit.
  # TODO Remove once this wart is no longer necessary.
  - inspect-ai==0.3.273

retry_on_error: 16  # https://github.com/epoch-research/epoch-hawk/pull/13
