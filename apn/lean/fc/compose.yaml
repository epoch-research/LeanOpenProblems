# Two sandboxes per sample (Formal Conjectures v4.27 track):
#   - default: the agent's workspace (apn-fc-agent) -- warm PyPantograph with
#              FormalConjectures.Util.ProblemImports preloaded; no SafeVerify.
#   - scorer:  a separate, trusted container (apn-fc-scorer) the agent never
#              writes to, where SafeVerify validates the final proof.
# Run several independent attempts per problem with `inspect eval ... --epochs N`.
services:
  default:
    image: apn-fc-agent
    command: ["sleep", "infinity"]
    init: true
    x-local: true
    network_mode: none
  scorer:
    image: apn-fc-scorer
    command: ["sleep", "infinity"]
    init: true
    x-local: true
    network_mode: none
