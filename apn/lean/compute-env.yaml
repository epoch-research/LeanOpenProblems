# The agent's compute environment: one locked conda-forge env at /opt/env
# (created by the Dockerfile's `compute_build` stage; /opt/env/bin is first on
# the agent's PATH, so this env's python IS the agent's `python3`).
#
# Every tool the agent is promised is listed here EXPLICITLY with an exact
# pin, even where it would arrive anyway as a sage dependency (pari, gap,
# maxima, singular, ecm, nauty, ...): the roster must not depend on what sage
# happens to pull. Transitive dependencies not listed here resolve at image
# build time. Version bumps are deliberate edits to this file. The solve is
# verified for linux-64 and linux-aarch64 (local dev on Apple silicon); when
# bumping a pin, keep versions that exist for both platforms.
#
# The `pip:` section holds the PyPI-only packages (no conda-forge build for
# both platforms); micromamba installs them into this same env right after the
# conda solve, so this file is the whole declaration of the agent's python.
# Rule: conda-forge when a both-platform pin exists and coexists with the sage
# stack, pip otherwise. Sage's optional backends/databases are ordinary
# packages in this env (conda-forge's Sage has no `sage -i`); the ones with no
# package at all (sagemath-giac, GAP packages, database tarballs) are installed
# by the Dockerfile's `compute_build` stage right after this env is created.
name: compute
channels:
  - conda-forge
dependencies:
  - python=3.13.15
  - pip=26.2.1
  # computer algebra systems and their engines
  - sage=10.9
  - pari=2.17.3          # PARI/GP: the `gp` binary + libpari
  - gap-defaults=4.15.1  # GAP: computational group theory
  - maxima=5.49.0
  - singular=4.4.1.p5
  # python stack
  - numpy=2.5.2
  - scipy=1.18.0
  - sympy=1.14.0
  - mpmath=1.4.1
  - pandas=3.0.5
  - networkx=3.6.1
  - python-igraph=0.11.9
  - python-flint=0.8.0
  - python-symengine=0.14.1  # sage's symengine_py backend
  - hypothesis=6.167.1
  - libsemigroups_pybind11=1.4.4
  # solvers (binary + python bindings)
  - z3-solver=5.1.0.0
  - glpk=5.0
  - clingo=5.8.2         # ASP: clingo binary + python module
  # cvxpy-base, not the `cvxpy` metapackage: that one hard-depends on highspy,
  # whose libhighs clashes with the one the ortools wheel bundles (whichever
  # imports second fails; cvxpy's GLOP/PDLP backends die the same way). LP/MIP
  # stay covered by scipy's built-in HiGHS (linprog/milp) and OR-Tools' own.
  - cvxpy-base=1.9.2     # convex-optimization modeling front end
  - clarabel=0.11.1
  - pycosat=0.6.6        # sage's picosat SAT backend
  - meson-python=0.21.0  # build dep of sagemath-giac (Dockerfile compute_build)
  # lattice reduction
  - fpylll=0.6.4
  # number theory CLI tools
  - primesieve=12.13
  - primecount=8.2
  - ecm=7.0.6            # GMP-ECM factorization
  # graph / discrete geometry / algebra CLI tools
  - nauty=2.9.3
  - cliquer=1.23
  - normaliz=3.11.0
  - 4ti2=1.6.15
  - lrslib=73.a
  # PyPI-only (see header). snappy is SnapPy (3-manifolds), not the compression
  # lib. pyscipopt's wheel bundles libscip (no conda scip/soplex coexists with
  # the sage stack's boost pin). graphillion compiles from sdist (no cp313
  # wheel). PyNormaliz's wheel bundles libnormaliz 3.11.0 (== the normaliz pin
  # above) and is linux-64-only on conda-forge; pycryptosat's bundles
  # libcryptominisat. The database-* packages are Sage's KnotInfo, matroid, and
  # cubic Hecke databases.
  - pip:
    - python-sat==1.9.dev15
    - cvc5==1.3.4
    - ortools==9.15.6755
    - snappy==3.3.2
    - pysindy==2.1.0
    - pymanopt==2.2.1
    - graphillion==2.1
    - pyscipopt==6.2.1
    - PyNormaliz==2.24
    - pycryptosat==5.14.7
    - database-knotinfo==2026.9.1
    - matroid-database==0.3
    - database-cubic-hecke==2022.4.4
