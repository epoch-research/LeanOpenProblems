# Lake project whose sole purpose is to make a built copy of Mathlib available
# to Pantograph. The Lean toolchain (lean-toolchain) and the Mathlib revision
# are pinned to v4.29.1, matching the Lean version that PyPantograph's bundled
# `pantograph-repl` binary is compiled against. The paper used Lean v4.27; we
# track v4.29.1 because that is the toolchain PyPantograph ships, and the two
# must agree for the repl to load Mathlib's `.olean` files.
#
# This package has no targets of its own: Pantograph imports Mathlib directly,
# and only needs Mathlib's prebuilt oleans on LEAN_PATH (via `lake exe cache
# get`). It is not necessary to `lake build` anything here.
name = "apnproject"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.1"
