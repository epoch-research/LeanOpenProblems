# Two sandboxes per sample:
#   - default: the agent's workspace (apn-agent) -- warm PyPantograph with
#              FormalConjectures.Util.ProblemImports preloaded; no SafeVerify.
#   - scorer:  a separate, trusted container (apn-scorer) the agent never writes
#              to, where SafeVerify validates the final proof.
# Run several independent attempts per problem with `inspect eval ... --epochs N`.
services:
  default:
    image: ${APN_AGENT_IMAGE:-apn-agent}
    command: ["sleep", "infinity"]
    init: true
    x-local: true
    network_mode: none
  scorer:
    image: ${APN_SCORER_IMAGE:-apn-scorer}
    command: ["sleep", "infinity"]
    init: true
    x-local: true
    network_mode: none
