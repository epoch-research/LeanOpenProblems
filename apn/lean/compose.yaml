# Two sandboxes per sample:
#   - default: the agent's workspace (${APN_IMAGE_NAME:-apn}:agent) -- warm
#              PyPantograph with FormalConjectures.Util.ProblemImports
#              preloaded; no SafeVerify.
#   - scorer:  a separate, trusted container (${APN_IMAGE_NAME:-apn}:scorer) the
#              agent never writes to, where SafeVerify validates the final proof.
# Run several independent attempts per problem with `inspect eval ... --epochs N`.
#
# APN_IMAGE_NAME is the image repository name. The tag after the colon identifies
# which sandbox image to use, following PortBench's generated compose pattern.
services:
  default:
    image: ${APN_IMAGE_NAME:-apn}:agent
    command: ["sleep", "infinity"]
    init: true
    x-local: true
    network_mode: none
  scorer:
    image: ${APN_IMAGE_NAME:-apn}:scorer
    command: ["sleep", "infinity"]
    init: true
    x-local: true
    network_mode: none
